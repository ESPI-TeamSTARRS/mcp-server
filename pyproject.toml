[project]
name = "mcp-server"
version = "0.1.0"
description = "MCP server exposing a BM25 keyword search over a documentation folder"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2,<2",
    "pydantic-settings>=2.16.0",
    "rank-bm25>=0.2.2",
    "snowballstemmer>=2.2",
]

[project.scripts]
bm25-mcp = "bm25_mcp.server:main"

[dependency-groups]
dev = [
    "poethepoet>=0.49.0",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bm25_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.poe.tasks]
test = { cmd = "pytest", help = "Run the test suite" }
serve = { cmd = "bm25-mcp", help = "Start the BM25 MCP server (see .env)" }
check = { sequence = ["test"], help = "Run every check (used by the pre-push hook)" }

[tool.semantic_release]
tag_format = "v{version}"
version_toml = ["pyproject.toml:project.version"]
