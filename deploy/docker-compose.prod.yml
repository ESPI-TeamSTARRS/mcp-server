services:
  app:
    # Image publiee par la CI, referencee par digest dans deploy/manifest.json (voir deploy.sh).
    image: ${APP_IMAGE:?lancer ./deploy.sh, image lue dans deploy/manifest.json}
    ports:
      - "8001:8001"
    environment:
      DEBUG: ${DEBUG:-false}
      DOCS_PATH: /app/documentations
    volumes:
      - ${DOCS_PATH:-./documentations}:/app/documentations:ro
